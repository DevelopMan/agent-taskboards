name: Setup help
description: Installation or first-run problems — model download, Docker build, first launch, or skill install.
labels:
  - setup
body:
  - type: markdown
    attributes:
      value: |
        Before you start: **do not paste real task content, credentials,
        `.env` values, or files from `data/` (the SQLite database)**. Redact
        command output before sharing. The
        [README](https://github.com/WarehouseRobotics/agent-taskboards#quick-start)
        covers the expected setup flow.
  - type: dropdown
    id: step
    attributes:
      label: Which step failed?
      options:
        - Downloading the embedding model
        - Building the image (`docker compose up --build`)
        - First launch / container startup
        - Opening the UI at http://localhost:8142
        - Installing the Claude Code skill
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: command-output
    attributes:
      label: Command and output (redacted)
      description: The exact command you ran and the output it produced, trimmed to the relevant part.
      render: text
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of `GET /api/health` (optional)
      description: If the server starts, include `curl http://localhost:8142/api/health`. It reports database status and the resolved model path — no task data.
      render: json
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Operating system and architecture
      options:
        - macOS (Apple Silicon)
        - Linux (x86-64)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: docker-versions
    attributes:
      label: Docker and Compose versions
      description: Output of `docker --version` and `docker compose version`.
      placeholder: Docker 27.3.1, Docker Compose v2.30.3
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real task content, credentials, `.env` values, or database files.
          required: true
